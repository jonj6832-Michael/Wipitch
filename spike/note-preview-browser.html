<!doctype html>
<meta charset="utf-8">
<base href="/">
<title>Tone.js 鋼琴試聽驗證</title>
<style>body{font:16px system-ui;background:#1b2028;color:#eee;padding:30px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Tone.js 鋼琴試聽驗證</h1>
<p>依序播放 A4、C4、C♯4，量測實際音訊輸出與放開後的衰減。</p>
<button id="run">執行驗證</button>
<pre id="result">等待執行</pre>
<script type="module">
import { loadPiano } from '/src/audio/tone-piano.ts';
import { getDestination } from 'tone';
const result = document.querySelector('#result');
document.querySelector('#run').onclick = async event => {
  event.target.disabled = true;
  const context = new AudioContext({ latencyHint: 'interactive' });
  try {
    await context.resume();
    result.textContent = '載入官方鋼琴取樣…';
    const piano = await loadPiano(context);
    const analyser = context.createAnalyser();
    analyser.fftSize = 32768;
    getDestination().connect(analyser);
    const bins = new Float32Array(analyser.frequencyBinCount);
    const waveform = new Float32Array(analyser.fftSize);
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const rms = () => {
      analyser.getFloatTimeDomainData(waveform);
      return Math.sqrt(waveform.reduce((sum, value) => sum + value * value, 0) / waveform.length);
    };
    const rows = [];
    for (const [note, midi, expected] of [['A4',69,440], ['C4',60,261.625565], ['C♯4',61,277.182631]]) {
      piano.attack(midi);
      await wait(800);
      const level = rms();
      analyser.getFloatFrequencyData(bins);
      // 鋼琴泛音可能比基音大，只在預期基音 ±10% 內找峰值。
      const lo = Math.floor(expected * .9 * analyser.fftSize / context.sampleRate);
      const hi = Math.ceil(expected * 1.1 * analyser.fftSize / context.sampleRate);
      let peak = lo;
      for (let i = lo + 1; i <= hi; i++) if (bins[i] > bins[peak]) peak = i;
      const hz = peak * context.sampleRate / analyser.fftSize;
      piano.release(midi);
      await wait(1200);
      const after = rms();
      if (level < .001 || Math.abs(hz / expected - 1) > .02 || after > level * .01) {
        throw new Error(`${note}: hz=${hz}, RMS=${level}, release=${after}`);
      }
      rows.push(`${note}: ${hz.toFixed(2)} Hz; RMS ${level.toFixed(5)} → ${after.toFixed(7)} PASS`);
      result.textContent = rows.join('\n');
    }
    result.textContent += '\nPASS: 真實取樣輸出、MIDI 音高對應、放開衰減';
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`;
  } finally {
    await context.close();
    event.target.disabled = false;
  }
};
</script>
